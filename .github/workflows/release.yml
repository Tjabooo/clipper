name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static)
        run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Package
        run: |
          cd target/${{ matrix.arch }}-unknown-linux-musl/release
          tar -czf "$GITHUB_WORKSPACE/clipper-${{ matrix.arch }}-linux.tar.gz" clipper clipper-bench
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: clipper-${{ matrix.arch }}-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (static CRT)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --bin clipper-bench
          copy target\release\clipper-bench.exe clipper-bench-x86_64-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: clipper-bench-x86_64-windows.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files="clipper-x86_64-linux.tar.gz clipper-aarch64-linux.tar.gz clipper-bench-x86_64-windows.exe"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
