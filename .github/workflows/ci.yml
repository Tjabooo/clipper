name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Smoke test
        run: |
          cargo build --release --locked
          target/release/clipper help > /dev/null
          target/release/clipper-bench --help > /dev/null
          target/release/clipper-bench settings --record '{"preset":"max"}' --size 2560x1440
      - name: Check shell scripts
        run: sh -n linux/install.sh && sh -n install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test clipper-bench
        run: |
          cargo test --locked --lib
          cargo build --release --locked --bin clipper-bench
          target\release\clipper-bench.exe --help
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build companion
        run: dotnet build windows/src/Clipper/Clipper.csproj -c Release
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem . -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\target\\' } | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" -ErrorAction Continue } }
          }
          if ($failed) { exit 1 }
