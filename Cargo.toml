[package]
name = "clipper"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Replay buffer and clip archive for Linux, plus a benchmark that picks the best clip settings"
license = "MIT"
repository = "https://github.com/Tjabooo/clipper"
publish = false

[lib]
name = "clipper"
path = "src/lib.rs"

[[bin]]
name = "clipper"
path = "src/bin/clipper.rs"

[[bin]]
name = "clipper-bench"
path = "src/bin/clipper-bench.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
